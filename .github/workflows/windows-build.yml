name: Windows build

on:
  push:
    paths:
      - "windows/**"
      - "shared/**"
      - "VERSION"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "windows/**"
      - "shared/**"
      - "VERSION"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore windows/JupitrApp.csproj

      - name: Build Release
        run: dotnet build windows/JupitrApp.csproj --configuration Release --no-restore

      - name: Publish Windows artifact
        run: dotnet publish windows/JupitrApp.csproj --configuration Release --runtime win-x64 --self-contained false --no-restore --output publish/windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jupitr-Windows-x64
          path: publish/windows
